name: Publish to PyPI

# Runs on a published GitHub release. Publishing happens only if every test passes on the oldest and newest
# supported Python, and the package version equals the release tag. No API token: PyPI trusted publishing.

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package
        run: python -m pip install .
      - name: Known-answer tests
        run: |
          python tests/test_gameability.py
          python tests/test_contract_inputs.py
          python tests/test_probe.py
      - name: CLI smoke test
        run: |
          gameability --version
          gameability probe --help

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version must equal the release tag
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "pyproject version v$v does not match tag ${GITHUB_REF_NAME}"; exit 1; }
      - run: python -m pip install build twine && python -m build && python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
