[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gameability"
version = "0.3.1"
description = "Find the problems in a code benchmark that accept broken solutions, and RL environments whose reward pays for no work."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Empyrean Intelligence" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
hf = ["datasets"]

[project.urls]
Homepage = "https://github.com/Empyrean-Intelligence/gameability"
Source = "https://github.com/Empyrean-Intelligence/gameability"
Issues = "https://github.com/Empyrean-Intelligence/gameability/issues"

[project.scripts]
gameability = "gameability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
